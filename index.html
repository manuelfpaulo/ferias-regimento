<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plano de Férias Vanguarda</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --texto: #211f1c;
    --texto-suave: #6b7280;
    --creme: #fff6ed;
    --input-borda: #fe8f4d;
    --input-borda-fraca: #f6bc86;
    --laranja: #e04400;
    --card-borda: #e8e6e5;
    --verde-ok: #2e7d4f;
    --vermelho-erro: #e12c2c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
    color: var(--texto);
  }

  body { min-height: 100vh; }

  .split {
    width: 100%;
    min-height: 100vh;
    display: flex;
    background: #ffffff;
  }

  .foto-lado {
    flex: 0 0 47%;
    background-image: url('foto-acipol.jpg');
    background-size: cover;
    background-position: center;
    border-radius: 0 48px 48px 0;
  }

  .painel {
    flex: 1;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 36px;
  }

  .cartao {
    width: 100%;
    max-width: 400px;
    background: #ffffff;
    border: 1px solid var(--card-borda);
    border-radius: 28px;
    padding: 30px 40px;
    box-shadow: 0 4px 24px rgba(20, 20, 20, 0.03);
  }

  .cartao-cabecalho {
    text-align: center;
    margin-bottom: 26px;
  }

  .cartao-cabecalho .eyebrow {
    letter-spacing: 0.12em;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--laranja);
    font-weight: 700;
    margin-bottom: 8px;
  }

  .cartao-cabecalho .logo {
    display: block;
    height: 72px;
    width: auto;
    margin: 0 auto 0px;
  }

  .cartao-cabecalho h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    color: var(--texto);
  }

  .cartao-cabecalho p {
    margin: 4px 0 0;
    font-size: 15px;
    color: var(--texto-suave);
  }

  .campo { margin-bottom: 16px; }

  .campo-mensagem {
    display: none;
    margin-top: 6px;
    font-size: 12px;
    color: var(--vermelho-erro);
    font-weight: 600;
  }

  .campo-linha {
    display: flex;
    gap: 10px;
  }

  .campo-linha .campo {
    flex: 1;
    min-width: 0;
  }

  .campo-inha .select-trigger {
    padding: 0 30px 0 12px;
    font-size: 13px;
  }

  .campo-mensagem.mostrar { display: block; }

  @keyframes abanar {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  .abanar { animation: abanar 0.4s; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--texto);
  }

  label .obrigatorio { color: var(--vermelho-erro); }

  select, input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--input-borda-fraca);
    border-radius: 21px;
    font-size: 14px;
    font-family: inherit;
    background: var(--creme);
    color: var(--texto);
    height: 42px;
    transition: border-color 0.15s ease, border-width 0.15s ease;
  }

  select:focus, input:focus {
    outline: none;
    border: 2px solid var(--input-borda);
  }

  /* ---- Dropdown customizado (substitui o <select> nativo) ---- */
  .select-custom { position: relative; }

  .select-trigger {
    width: 100%;
    height: 42px;
    padding: 0 40px 0 16px;
    border: 1px solid var(--input-borda-fraca);
    border-radius: 21px;
    background: var(--creme);
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    color: var(--texto);
    text-align: left;
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s ease, border-width 0.15s ease;
  }

  .select-trigger.placeholder {
    color: #9b9086;
    font-weight: 400;
  }

  .select-trigger::after {
    content: '';
    position: absolute;
    right: 16px;
    top: 50%;
    width: 9px;
    height: 9px;
    border-right: 2px solid var(--laranja);
    border-bottom: 2px solid var(--laranja);
    transform: translateY(-70%) rotate(45deg);
    transition: transform 0.15s ease;
    pointer-events: none;
  }

  .select-trigger.aberto::after { transform: translateY(-30%) rotate(225deg); }

  .select-trigger:focus,
  .select-trigger.aberto {
    outline: none;
    border: 2px solid var(--input-borda);
  }

  .select-trigger.erro { border-color: var(--vermelho-erro); }

  input.erro {
    border: 2px solid var(--vermelho-erro);
  }

  .select-options {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    background: #ffffff;
    border: 1px solid var(--card-borda);
    border-radius: 16px;
    box-shadow: 0 10px 28px rgba(20, 20, 20, 0.10);
    max-height: 230px;
    overflow-y: auto;
    padding: 6px;
    z-index: 30;
  }

  .select-option {
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    color: var(--texto);
    cursor: pointer;
  }

  .select-option:hover,
  .select-option.destaque {
    background: var(--creme);
    color: var(--laranja);
  }

  .select-option.selecionado {
    color: var(--laranja);
    font-weight: 700;
  }

  button {
    width: 100%;
    padding: 12px;
    height: 42px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s ease, opacity 0.15s ease;
    border-radius: 21px;
  }

  .btn-primario {
    background: var(--creme);
    color: var(--laranja);
    border: 1px solid var(--input-borda-fraca);
  }
  .btn-primario:hover { background: #ffece0; }
  .btn-primario:disabled { color: #d9b79a; border-color: #f0d9c0; cursor: not-allowed; }

  .spinner {
    display: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: conic-gradient(from 90deg, transparent, currentColor);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0);
    mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 0);
    animation: girar 0.7s linear infinite;
  }

  @keyframes girar {
    to { transform: rotate(360deg); }
  }

  .a-processar .texto-botao { display: none; }
  .a-processar .spinner { display: inline-block; }

  .btn-secundario {
    background: #ffffff;
    color: var(--laranja);
    border: 1px solid var(--card-borda);
    margin-top: 10px;
  }
  .btn-secundario:hover { background: #fafafa; }

  .btn-link {
    display: inline-block;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--laranja);
    text-decoration: none;
    cursor: pointer;
    font-weight: 600;
  }
  .btn-link:hover { text-decoration: underline; }

  .estado {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
  }

  .estado.mostrar { display: block; }
  .estado.ok { background: #e6f4ec; color: var(--verde-ok); border: 1px solid #b7ddc4; }
  .estado.erro { background: #fbeceb; color: var(--vermelho-erro); border: 1px solid #edc4c1; }
  .estado.fila { background: #fff6e6; color: #8a5a10; border: 1px solid #f0d9a8; }

  .contador-fila {
    margin-top: 14px;
    font-size: 12px;
    color: var(--texto-suave);
    text-align: center;
  }

  .resultado-verificacao {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
  }

  .estado, .resultado-verificacao {
    position: relative;
    overflow: hidden;
  }

  .barra-regressiva {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 100%;
    background: currentColor;
    opacity: 0.45;
    transform-origin: left;
  }

  @keyframes contagemRegressiva {
    from { transform: scaleX(1); }
    to { transform: scaleX(0); }
  }

  .resultado-verificacao.mostrar { display: block; }
  .resultado-verificacao.encontrado { background: #e6f4ec; border: 1px solid #b7ddc4; }
  .resultado-verificacao.nao-encontrado { background: #fbeceb; border: 1px solid #edc4c1; }

  .resultado-verificacao dl {
    margin: 8px 0 0;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 12px;
  }

  .resultado-verificacao dt { font-weight: 600; color: var(--texto); }
  .resultado-verificacao dd { margin: 0; }

  .versao {
    margin-top: 22px;
    text-align: center;
    font-size: 11px;
    color: #9aa4b2;
  }

  .pagina { display: none; }
  .pagina.ativa { display: block; }

  @media (max-width: 780px) {
    .foto-lado { display: none; }
    .split { min-height: unset; box-shadow: none; border-top: none; }
    .painel { padding: 8px; }
  }
</style>
</head>
<body>

<div class="split">
  <div class="foto-lado"></div>

  <div class="painel">
    <div class="cartao">

      <!-- ==================== PÁGINA 1: FORMULÁRIO ==================== -->
      <div class="pagina ativa" id="paginaFormulario">
        <div class="cartao-cabecalho">
          <img class="logo" src="favicon.png" alt="Emblema ACIPOL" />
          <h1>ACIPOL</h1>
          <h1>PLANO DE FÉRIAS 2026</h1>
          <p>Selecione o seu ano, turma e complete os dados</p>
        </div>

        <form id="formFerias" novalidate>
          <div class="campo-linha">
            <div class="campo select-custom">
              <label for="anoTrigger">Ano</label>
              <button type="button" class="select-trigger placeholder" id="anoTrigger">Ano</button>
              <div class="select-options" id="anoOptions" hidden></div>
              <input type="hidden" id="ano" name="ano" required />
              <div class="campo-mensagem" id="msgAno"></div>
            </div>

            <div class="campo select-custom">
              <label for="turmaTrigger">Turma</label>
              <button type="button" class="select-trigger placeholder" id="turmaTrigger">Turma</button>
              <div class="select-options" id="turmaOptions" hidden></div>
              <input type="hidden" id="turma" name="turma" required />
              <div class="campo-mensagem" id="msgTurma"></div>
            </div>
          </div>

          <div class="campo">
            <label for="nomeCompleto">Nome Completo</label>
            <input type="text" id="nomeCompleto" name="nomeCompleto" placeholder="Ex: Élio Fernando Homo" required />
            <div class="campo-mensagem" id="msgNomeCompleto"></div>
          </div>

          <div class="campo select-custom">
            <label for="delegacaoTrigger">Delegação</label>
            <button type="button" class="select-trigger placeholder" id="delegacaoTrigger">Selecione a delegação</button>
            <div class="select-options" id="delegacaoOptions" hidden></div>
            <input type="hidden" id="delegacao" name="delegacao" required />
            <div class="campo-mensagem" id="msgDelegacao"></div>
          </div>

          <div class="campo select-custom">
            <label for="provinciaTrigger">Província para Férias</label>
            <button type="button" class="select-trigger placeholder" id="provinciaTrigger">Selecione a província</button>
            <div class="select-options" id="provinciaOptions" hidden></div>
            <input type="hidden" id="provincia" name="provincia" required />
            <div class="campo-mensagem" id="msgProvincia"></div>
          </div>

          <div class="campo">
            <label for="contactoPessoal">Contacto Pessoal</label>
            <input type="tel" id="contactoPessoal" name="contactoPessoal"
                  placeholder="8X XXX XXXX" inputmode="numeric" maxlength="11" required />
            <div class="campo-mensagem" id="msgContactoPessoal"></div>
          </div>

          <div class="campo">
            <label for="contactoFamiliar">Contacto Familiar</label>
            <input type="tel" id="contactoFamiliar" name="contactoFamiliar"
                  placeholder="8X XXX XXXX" inputmode="numeric" maxlength="11" required />
            <div class="campo-mensagem" id="msgContactoFamiliar"></div>
          </div>

          <button type="submit" class="btn-primario" id="btnEnviar">
            <span class="texto-botao">Enviar</span>
            <span class="spinner"></span>
          </button>
          <button type="button" class="btn-secundario" id="btnIrVerificar">Ver meu envio</button>

          <div class="estado" id="estado"></div>
          <div class="contador-fila" id="contadorFila"></div>
        </form>

        <div class="versao">
          <footer>
            <p> &copy; <span id="ano-atual"></span> MFP Ubuntu. Todos os direitos reservados</p>
          </footer>

          <script>
            document.getElementById("ano-atual").textContent = new Date().getFullYear();
          </script>

        </div>
      </div>

      <!-- ==================== PÁGINA 2: VERIFICAÇÃO ==================== -->
      <div class="pagina" id="paginaVerificacao">
        <a class="btn-link" id="btnVoltar">&larr; Voltar ao formulário</a>

        <div class="cartao-cabecalho">
          <img class="logo" src="favicon.png" alt="Emblema ACIPOL" />
          <h1>Ver meu envio</h1>
          <p>Confirme se os seus dados já constam na tabela da sua turma.</p>
        </div>

        <div class="campo-linha">
          <div class="campo select-custom">
            <label for="verAnoTrigger">Ano</label>
            <button type="button" class="select-trigger placeholder" id="verAnoTrigger">Ano</button>
            <div class="select-options" id="verAnoOptions" hidden></div>
            <input type="hidden" id="verAno" />
            <div class="campo-mensagem" id="msgVerAno"></div>
          </div>

          <div class="campo select-custom">
            <label for="verTurmaTrigger">Turma</label>
            <button type="button" class="select-trigger placeholder" id="verTurmaTrigger">Turma</button>
            <div class="select-options" id="verTurmaOptions" hidden></div>
            <input type="hidden" id="verTurma" />
            <div class="campo-mensagem" id="msgVerTurma"></div>
          </div>
        </div>

        <div class="campo">
          <label for="verNome">Primeiro Nome</label>
          <input type="text" id="verNome" placeholder="Ex: Élio" />
          <div class="campo-mensagem" id="msgVerNome"></div>
        </div>

        <button type="button" class="btn-primario" id="btnVerificar">
          <span class="texto-botao">Verificar</span>
          <span class="spinner"></span>
        </button>

        <div class="resultado-verificacao" id="resultadoVerificacao"></div>
      </div>

    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxVsU-j2T9ag2qIcV7OSfbmCHkAqZ9dZx5Rl6ekMcBmnRCJwbi3bJnufpqHktk1ww/exec';

  const ANOS = ['1º Ano', '2º Ano', '3º Ano'];
  const TURMAS = ['Turma A', 'Turma B', 'Turma C', 'Turma D', 'Turma E', 'Turma F', 'Turma G', 'Turma H', 'Turma I'];
  const PROVINCIAS = ['Niassa', 'C. Delgado', 'Nampula', 'Zambézia', 'Tete', 'Manica', 'Sofala', 'Inhambane', 'Gaza', 'Maputo Prov', 'Maputo Cid', 'ACIPOL'];

  function criarDropdown(triggerId, optionsId, hiddenId, valores) {
    const trigger = document.getElementById(triggerId);
    const optionsEl = document.getElementById(optionsId);
    const hidden = document.getElementById(hiddenId);
    const textoBase = trigger.textContent;

    optionsEl.innerHTML = valores.map(v =>
      `<div class="select-option" data-value="${v}">${v}</div>`
    ).join('');

    function fechar() {
      optionsEl.hidden = true;
      trigger.classList.remove('aberto');
    }

    function abrir() {
      document.querySelectorAll('.select-options').forEach(el => { el.hidden = true; });
      document.querySelectorAll('.select-trigger').forEach(el => el.classList.remove('aberto'));
      optionsEl.hidden = false;
      trigger.classList.add('aberto');
    }

    trigger.addEventListener('click', (evento) => {
      evento.stopPropagation();
      if (optionsEl.hidden) abrir(); else fechar();
    });

    optionsEl.querySelectorAll('.select-option').forEach((opcao) => {
      opcao.addEventListener('click', () => {
        hidden.value = opcao.dataset.value;
        trigger.textContent = opcao.dataset.value;
        trigger.classList.remove('placeholder', 'erro');
        const mensagem = trigger.closest('.campo').querySelector('.campo-mensagem');
        if (mensagem) { mensagem.classList.remove('mostrar'); mensagem.textContent = ''; }
        optionsEl.querySelectorAll('.select-option').forEach(o => o.classList.remove('selecionado'));
        opcao.classList.add('selecionado');
        fechar();
        hidden.dispatchEvent(new Event('change'));
      });
    });

    document.addEventListener('click', (evento) => {
      if (!trigger.contains(evento.target) && !optionsEl.contains(evento.target)) fechar();
    });

    return {
      reset() {
        hidden.value = '';
        trigger.textContent = textoBase;
        trigger.classList.add('placeholder');
        trigger.classList.remove('erro');
        optionsEl.querySelectorAll('.select-option').forEach(o => o.classList.remove('selecionado'));
      }
    };
  }

  const dropdownAno = criarDropdown('anoTrigger', 'anoOptions', 'ano', ANOS);
  const dropdownTurma = criarDropdown('turmaTrigger', 'turmaOptions', 'turma', TURMAS);
  const dropdownDelegacao = criarDropdown('delegacaoTrigger', 'delegacaoOptions', 'delegacao', PROVINCIAS);
  const dropdownProvincia = criarDropdown('provinciaTrigger', 'provinciaOptions', 'provincia', PROVINCIAS);
  const dropdownVerAno = criarDropdown('verAnoTrigger', 'verAnoOptions', 'verAno', ANOS);
  const dropdownVerTurma = criarDropdown('verTurmaTrigger', 'verTurmaOptions', 'verTurma', TURMAS);

  // ---Barra de contagem regressiva para auto-ocultar mensagens ---
  function autoOcultar(elemento, duracaoMs = 5000) {
    clearTimeout(elemento._temporizador);
    let barra = elemento.querySelector('.barra-regressiva');
    if (!barra) {
      barra = document.createElement('div');
      barra.className = 'barra-regressiva';
      elemento.appendChild(barra);
    }
    barra.style.animation = 'none';
    void barra.offsetWidth; // força reflow para reiniciar a animação
    barra.style.animation = `contagemRegressiva ${duracaoMs}ms linear forwards`;

    elemento._temporizador = setTimeout(() => {
      elemento.classList.remove('mostrar');
    }, duracaoMs);
  }

  function limparCamposVerificacao() {
    dropdownVerAno.reset();
    dropdownVerTurma.reset();
    document.getElementById('verNome').value = '';
  }

  // --- Validação por campo: mensagem de obrigatoriedade + sinal de "abanar" ---
  function mostrarErroCampo(elemento, msgEl, texto) {
    msgEl.textContent = texto;
    msgEl.classList.add('mostrar');
    elemento.classList.add('erro');
    elemento.classList.remove('abanar');
    void elemento.offsetWidth; // força reflow para poder repetir a animação
    elemento.classList.add('abanar');
  }

  function limparErroCampo(elemento, msgEl) {
    msgEl.classList.remove('mostrar');
    msgEl.textContent = '';
    elemento.classList.remove('erro');
  }

  document.querySelectorAll('.abanar, input, .select-trigger').forEach((el) => {
    el.addEventListener('animationend', () => el.classList.remove('abanar'));
  });

  // --- Navegação entre páginas ---
  const paginaFormulario = document.getElementById('paginaFormulario');
  const paginaVerificacao = document.getElementById('paginaVerificacao');
  const btnIrVerificar = document.getElementById('btnIrVerificar');
  const btnVoltar = document.getElementById('btnVoltar');

  btnIrVerificar.addEventListener('click', () => {
    paginaFormulario.classList.remove('ativa');
    paginaVerificacao.classList.add('ativa');
  });

  btnVoltar.addEventListener('click', () => {
    paginaVerificacao.classList.remove('ativa');
    paginaFormulario.classList.add('ativa');
  });

  // --- Formulário + fila offline ---
  const CHAVE_FILA = 'planoFerias_filaSubmissoes';
  const form = document.getElementById('formFerias');
  const estadoEl = document.getElementById('estado');
  const contadorEl = document.getElementById('contadorFila');
  const btnEnviar = document.getElementById('btnEnviar');
  const btnVerificar = document.getElementById('btnVerificar');

  ['nomeCompleto', 'contactoPessoal', 'contactoFamiliar'].forEach((id) => {
    const input = document.getElementById(id);
    const msg = document.getElementById('msg' + id.charAt(0).toUpperCase() + id.slice(1));
    input.addEventListener('input', () => limparErroCampo(input, msg));
  });

  function permitirApenasLetras(id) {
    const input = document.getElementById(id);
    input.addEventListener('input', () => {
      const posicao = input.selectionStart;
      const original = input.value;
      input.value = input.value.replace(/[^A-Za-zÀ-ÖØ-öø-ÿ\s]/g, '');
      // ajusta o cursor se algum caráter foi removido a meio do texto
      if (input.value.length !== original.length) {
        input.setSelectionRange(posicao - 1, posicao - 1);
      }
    });
  }
  permitirApenasLetras('nomeCompleto');
  permitirApenasLetras('verNome');

  function submeterComEnter(idCampo, botao) {
    document.getElementById(idCampo).addEventListener('keydown', (evento) => {
      if (evento.key === 'Enter') {
        evento.preventDefault();
        botao.click();
      }
    });
  }
  submeterComEnter('nomeCompleto', btnEnviar);
  submeterComEnter('contactoPessoal', btnEnviar);
  submeterComEnter('contactoFamiliar', btnEnviar);
  submeterComEnter('verNome', btnVerificar);

  // --- Máscara e validação dos contactos (formato moçambicano: 8X XXX XXXX) ---
  function contactoValido(valor) {
    const digitos = valor.replace(/\D/g, '');
    return /^8[2-8]\d{7}$/.test(digitos); // 9 dígitos: 8, depois 2-8, depois mais 7
  }

  function aplicarMascaraContacto(id) {
    const input = document.getElementById(id);
    input.addEventListener('input', () => {
      let digitos = input.value.replace(/\D/g, '');

      // descarta dígitos iniciais que não sejam 8
      while (digitos.length > 0 && digitos[0] !== '8') {
        digitos = digitos.slice(1);
      }
      // se o segundo dígito não for 2-8, remove-o (não deixa escrever)
      if (digitos.length > 1 && !/[2-8]/.test(digitos[1])) {
        digitos = digitos.slice(0, 1) + digitos.slice(2);
      }

      digitos = digitos.slice(0, 9);
      let formatado = digitos;
      if (digitos.length > 2) formatado = digitos.slice(0, 2) + ' ' + digitos.slice(2, 5);
      if (digitos.length > 5) formatado += ' ' + digitos.slice(5, 9);
      input.value = formatado;
    });
  }
  aplicarMascaraContacto('contactoPessoal');
  aplicarMascaraContacto('contactoFamiliar');


  function lerFila() {
    try {
      return JSON.parse(localStorage.getItem(CHAVE_FILA)) || [];
    } catch (e) {
      return [];
    }
  }

  function guardarFila(fila) {
    localStorage.setItem(CHAVE_FILA, JSON.stringify(fila));
    atualizarContador();
  }

  function adicionarNaFila(dados) {
    const fila = lerFila();
    fila.push({ dados, timestamp: Date.now(), tentativas: 0 });
    guardarFila(fila);
  }

  function atualizarContador() {
    const fila = lerFila();
    contadorEl.textContent = fila.length > 0
      ? `${fila.length} Submissão(ões) pendente(s), serão enviadas automaticamente após ligação.`
      : '';
  }

  function mostrarEstado(tipo, mensagem) {
    estadoEl.className = 'estado mostrar ' + tipo;
    estadoEl.textContent = mensagem;
    autoOcultar(estadoEl);
  }

  async function enviarParaServidor(dados) {
    const resposta = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita pre-flight CORS
      body: JSON.stringify(dados)
    });
    // Apps Script Web Apps: a resposta pode ser opaca em certos cenários,
    // por isso tentamos ler o JSON e caímos para "sucesso assumido" se falhar.
    try {
      const json = await resposta.json();
      return json;
    } catch (e) {
      return { sucesso: true };
    }
  }

  async function tentarReenviarFila() {
    let fila = lerFila();
    if (fila.length === 0) return;

    const restantes = [];
    let duplicados = 0;
    for (const item of fila) {
      try {
        const resultado = await enviarParaServidor(item.dados);
        if (!resultado.sucesso) {
          if (resultado.duplicado) {
            duplicados += 1; // descarta: já consta na tabela, reenviar não resolve
          } else {
            item.tentativas += 1;
            restantes.push(item);
          }
        }
      } catch (e) {
        item.tentativas += 1;
        restantes.push(item);
      }
    }
    guardarFila(restantes);

    if (duplicados > 0) {
      mostrarEstado('erro', `${duplicados} registo(s) pendente(s) foram descartados por já estarem cadastrados.`);
    }

    if (restantes.length === 0 && fila.length > 0) {
      mostrarEstado('ok', 'Submissões pendentes foram enviadas com sucesso.');
    }
  }

  form.addEventListener('submit', async (evento) => {
    evento.preventDefault();
    btnEnviar.disabled = true;
    btnEnviar.classList.add('a-processar');

    const dados = {
      ano: document.getElementById('ano').value,
      turma: document.getElementById('turma').value,
      nomeCompleto: document.getElementById('nomeCompleto').value.trim(),
      delegacao: document.getElementById('delegacao').value.trim(),
      provincia: document.getElementById('provincia').value.trim(),
      contactoPessoal: document.getElementById('contactoPessoal').value.trim(),
      contactoFamiliar: document.getElementById('contactoFamiliar').value.trim()
    };

    const camposObrigatorios = [
      { valor: dados.ano, elemento: document.getElementById('anoTrigger'), msg: document.getElementById('msgAno'), texto: 'Selecione o ano de frequência.' },
      { valor: dados.turma, elemento: document.getElementById('turmaTrigger'), msg: document.getElementById('msgTurma'), texto: 'Selecione a turma.' },
      { valor: dados.nomeCompleto, elemento: document.getElementById('nomeCompleto'), msg: document.getElementById('msgNomeCompleto'), texto: 'Indique o nome completo.' },
      { valor: dados.delegacao, elemento: document.getElementById('delegacaoTrigger'), msg: document.getElementById('msgDelegacao'), texto: 'Selecione a delegação.' },
      { valor: dados.provincia, elemento: document.getElementById('provinciaTrigger'), msg: document.getElementById('msgProvincia'), texto: 'Selecione a província.' },
      { valor: dados.contactoPessoal && contactoValido(dados.contactoPessoal) ? dados.contactoPessoal : '', elemento: document.getElementById('contactoPessoal'), msg: document.getElementById('msgContactoPessoal'), texto: dados.contactoPessoal ? 'Número inválido — use 9 dígitos começados por 8.' : 'Indique o contacto pessoal.' },
      { valor: dados.contactoFamiliar && contactoValido(dados.contactoFamiliar) ? dados.contactoFamiliar : '', elemento: document.getElementById('contactoFamiliar'), msg: document.getElementById('msgContactoFamiliar'), texto: dados.contactoFamiliar ? 'Número inválido — use 9 dígitos começados por 8.' : 'Indique o contacto familiar.' }
    ];

    let primeiroCampoInvalido = null;
    camposObrigatorios.forEach((c) => {
      if (!c.valor) {
        mostrarErroCampo(c.elemento, c.msg, c.texto);
        if (!primeiroCampoInvalido) primeiroCampoInvalido = c.elemento;
      } else {
        limparErroCampo(c.elemento, c.msg);
      }
    });

    if (primeiroCampoInvalido) {
      primeiroCampoInvalido.scrollIntoView({ behavior: 'smooth', block: 'center' });
      btnEnviar.disabled = false;
      btnEnviar.classList.remove('a-processar');
      return;
    }

    if (!navigator.onLine) {
      adicionarNaFila(dados);
      mostrarEstado('fila', 'Sem ligação à internet. Os dados foram guardados e serão enviados automaticamente.');
      form.reset();
      dropdownAno.reset();
      dropdownTurma.reset();
      dropdownDelegacao.reset();
      dropdownProvincia.reset();
      btnEnviar.disabled = false;
      btnEnviar.classList.remove('a-processar');
      return;
    }

    try {
      const resultado = await enviarParaServidor(dados);
      if (resultado.sucesso) {
        mostrarEstado('ok', `Registo enviado com sucesso para ${dados.ano}, ${dados.turma}.`);
        form.reset();
        dropdownAno.reset();
        dropdownTurma.reset();
        dropdownDelegacao.reset();
        dropdownProvincia.reset();
      } else if (resultado.duplicado) {
        mostrarEstado('erro', resultado.erro || 'Cadete já inserido.');
        // Não entra na fila: reenviar não vai resolver, o nome já consta na tabela.
      } else {
        mostrarEstado('erro', resultado.erro || 'Ocorreu um erro ao enviar.');
        adicionarNaFila(dados);
      }
    } catch (erro) {
      adicionarNaFila(dados);
      mostrarEstado('fila', 'Falha na ligação. Os dados foram guardados e serão reenviados automaticamente.');
      form.reset();
      dropdownAno.reset();
      dropdownTurma.reset();
      dropdownDelegacao.reset();
      dropdownProvincia.reset();
    }

    btnEnviar.disabled = false;
    btnEnviar.classList.remove('a-processar');
  });

  window.addEventListener('online', tentarReenviarFila);
  window.addEventListener('load', () => {
    atualizarContador();
    tentarReenviarFila();
    // Trava a altura do painel com base na página do formulário (a mais alta),
      // para a foto ficar sempre com o mesmo enquadramento nas duas páginas.
      const painel = document.querySelector('.painel');
      const alturaFormulario = document.getElementById('paginaFormulario').offsetHeight;
      const alturaMinima = Math.max(alturaFormulario + 60, window.innerHeight);
      painel.style.minHeight = alturaMinima + 'px';
    });

  // --- Verificar o meu registo ---
  const resultadoEl = document.getElementById('resultadoVerificacao');

  document.getElementById('verNome').addEventListener('input', () => {
    limparErroCampo(document.getElementById('verNome'), document.getElementById('msgVerNome'));
  });

  btnVerificar.addEventListener('click', async () => {
    const ano = document.getElementById('verAno').value;
    const turma = document.getElementById('verTurma').value;
    const nome = document.getElementById('verNome').value.trim();
    const verAnoTrigger = document.getElementById('verAnoTrigger');
    const verTurmaTrigger = document.getElementById('verTurmaTrigger');
    const verNomeInput = document.getElementById('verNome');
    const msgVerAno = document.getElementById('msgVerAno');
    const msgVerTurma = document.getElementById('msgVerTurma');
    const msgVerNome = document.getElementById('msgVerNome');

    let faltaAlgo = false;
    if (!ano) {
      mostrarErroCampo(verAnoTrigger, msgVerAno, 'Selecione o ano.');
      faltaAlgo = true;
    } else {
      limparErroCampo(verAnoTrigger, msgVerAno);
    }
    if (!turma) {
      mostrarErroCampo(verTurmaTrigger, msgVerTurma, 'Selecione a turma.');
      faltaAlgo = true;
    } else {
      limparErroCampo(verTurmaTrigger, msgVerTurma);
    }
    if (!nome) {
      mostrarErroCampo(verNomeInput, msgVerNome, 'Escreva o primeiro nome.');
      faltaAlgo = true;
    } else {
      limparErroCampo(verNomeInput, msgVerNome);
    }
    if (faltaAlgo) return;

    btnVerificar.disabled = true;
    btnVerificar.classList.add('a-processar');

    try {
      const url = `${SCRIPT_URL}?accao=verificar&ano=${encodeURIComponent(ano)}&turma=${encodeURIComponent(turma)}&nome=${encodeURIComponent(nome)}`;
      const resposta = await fetch(url);
      const resultado = await resposta.json();

      if (!resultado.sucesso) {
        mostrarResultado('nao-encontrado', resultado.erro || 'Não foi possível verificar agora.');
        autoOcultar(resultadoEl);
      } else if (resultado.encontrado) {
        resultadoEl.className = 'resultado-verificacao mostrar encontrado';
        if (resultado.resultados.length === 1) {
          const d = resultado.resultados[0];
          resultadoEl.innerHTML = `
            <strong>✓ Encontrado na tabela de ${turma} (${ano}).</strong>
            <dl>
              <dt>Nº</dt><dd>${d.numero}</dd>
              <dt>Nome</dt><dd>${d.nomeCompleto}</dd>
              <dt>Delegação</dt><dd>${d.delegacao}</dd>
              <dt>Província</dt><dd>${d.provincia}</dd>
              <dt>Contacto Pessoal</dt><dd>${d.contactoPessoal}</dd>
              <dt>Contacto Familiar</dt><dd>${d.contactoFamiliar}</dd>
            </dl>`;
          autoOcultar(resultadoEl);
        } else {
          const linhas = resultado.resultados.map(d => `
            <dl>
              <dt>Nº</dt><dd>${d.numero}</dd>
              <dt>Nome</dt><dd>${d.nomeCompleto}</dd>
              <dt>Delegação</dt><dd>${d.delegacao}</dd>
              <dt>Província</dt><dd>${d.provincia}</dd>
              <dt>Contacto Pessoal</dt><dd>${d.contactoPessoal}</dd>
              <dt>Contacto Familiar</dt><dd>${d.contactoFamiliar}</dd>
            </dl>`).join('<hr style="margin:10px 0;border-color:#cfe4d8;">');
          resultadoEl.innerHTML = `
            <strong>✓ ${resultado.resultados.length} cadetes encontrados com esse primeiro nome em ${turma} (${ano}). Confirme qual é o seu:</strong>
            ${linhas}`;
        }
        limparCamposVerificacao();
      } else {
        mostrarResultado('nao-encontrado', 'Ainda não encontrado nesta turma. Se acabou de submeter e está sem internet, aguarde a ligação — o registo será enviado automaticamente.');
        limparCamposVerificacao();
      }
    } catch (erro) {
      mostrarResultado('nao-encontrado', 'Não foi possível ligar ao servidor. Tente novamente quando tiver internet.');
      autoOcultar(resultadoEl);
    }

    btnVerificar.disabled = false;
    btnVerificar.classList.remove('a-processar');
  });

  function mostrarResultado(tipo, mensagem) {
    resultadoEl.className = 'resultado-verificacao mostrar ' + tipo;
    resultadoEl.textContent = mensagem;
    autoOcultar(resultadoEl);
  }
</script>

</body>
